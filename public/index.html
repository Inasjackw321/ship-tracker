<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ship Tracker - Ireland</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
            background: #1a1a1a;
            color: #fff;
        }

        #sidebar {
            width: 350px;
            background: #2d2d2d;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #4fc3f7;
        }

        .subtitle {
            color: #999;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #4fc3f7;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #29b6f6;
        }

        button.secondary {
            background: #666;
        }

        button.secondary:hover {
            background: #555;
        }

        .time-controls {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #999;
        }

        select, input {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 5px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stats {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .stat-label {
            color: #999;
        }

        .stat-value {
            color: #4fc3f7;
            font-weight: bold;
        }

        .ship-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .ship-item {
            background: #1a1a1a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .ship-item:hover {
            background: #333;
        }

        .ship-name {
            font-weight: bold;
            color: #4fc3f7;
            margin-bottom: 5px;
        }

        .ship-info {
            font-size: 12px;
            color: #999;
        }

        .loading {
            text-align: center;
            color: #999;
            padding: 20px;
        }

        .ship-type {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 11px;
            margin-top: 5px;
        }

        .type-cargo { background: #ff9800; }
        .type-tanker { background: #f44336; }
        .type-passenger { background: #4caf50; }
        .type-fishing { background: #2196f3; }
        .type-unknown { background: #666; }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h1>🚢 Ship Tracker</h1>
        <div class="subtitle">Ireland Maritime Traffic</div>

        <div class="controls">
            <div class="button-group">
                <button id="showCurrentBtn">Current Ships</button>
                <button id="refreshBtn" class="secondary">Refresh</button>
            </div>

            <div class="time-controls">
                <label for="timeRange">Historical View:</label>
                <select id="timeRange">
                    <option value="current">Live (Current)</option>
                    <option value="1">Last 1 hour</option>
                    <option value="6">Last 6 hours</option>
                    <option value="24">Last 24 hours</option>
                    <option value="168">Last 7 days</option>
                </select>
            </div>

            <div class="time-controls" id="shipSelector" style="display: none;">
                <label for="selectedShip">Track Specific Ship:</label>
                <select id="selectedShip">
                    <option value="">All Ships</option>
                </select>
            </div>
        </div>

        <div class="stats">
            <div class="stat-row">
                <span class="stat-label">Total Ships:</span>
                <span class="stat-value" id="totalShips">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Last Update:</span>
                <span class="stat-value" id="lastUpdate">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Status:</span>
                <span class="stat-value" id="status">Ready</span>
            </div>
        </div>

        <h3 style="margin-bottom: 10px; font-size: 16px;">Ships in View</h3>
        <div class="ship-list" id="shipList">
            <div class="loading">No ships loaded yet</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
